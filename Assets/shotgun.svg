<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylized pump-action shotgun illustration">
    <defs>
        <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"  stop-color="#3a352b"/>
            <stop offset="45%" stop-color="#1c1912"/>
            <stop offset="55%" stop-color="#100e0a"/>
            <stop offset="100%" stop-color="#050403"/>
        </linearGradient>

        <linearGradient id="brassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#e6c065"/>
            <stop offset="50%"  stop-color="#c9962c"/>
            <stop offset="100%" stop-color="#7a5f22"/>
        </linearGradient>

        <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#7a4d28"/>
            <stop offset="55%"  stop-color="#4e2f19"/>
            <stop offset="100%" stop-color="#2c1a0e"/>
        </linearGradient>

        <filter id="grainShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
        </filter>
    </defs>

    <g filter="url(#grainShadow)">

        <!-- faint muzzle haze -->
        <path d="M600,88 C625,80 638,86 636,94 C634,102 618,100 604,96 Z"
              fill="#e2422a" opacity="0.18"/>

        <!-- stock -->
        <path d="M42,168
                 L96,158
                 L162,116
                 L172,100
                 L178,112
                 L176,128
                 L118,168
                 L70,196
                 L46,196
                 Z"
              fill="url(#wood)" stroke="#050403" stroke-width="2" stroke-linejoin="round"/>
        <path d="M96,158 L162,116" stroke="#1c1108" stroke-width="1.5" opacity="0.5"/>
        <path d="M84,172 L150,132" stroke="#1c1108" stroke-width="1.5" opacity="0.4"/>

        <!-- trigger guard -->
        <path d="M186,128 C182,146 190,160 206,160 C214,160 219,153 218,145"
              fill="none" stroke="url(#metal)" stroke-width="6" stroke-linecap="round"/>
        <line x1="200" y1="130" x2="202" y2="150" stroke="#0b0a08" stroke-width="3" stroke-linecap="round"/>

        <!-- pistol grip -->
        <path d="M176,112 L200,100 L214,124 L192,144 L176,128 Z"
              fill="url(#wood)" stroke="#050403" stroke-width="2" stroke-linejoin="round"/>

        <!-- receiver -->
        <rect x="176" y="66" width="96" height="52" rx="6"
              fill="url(#metal)" stroke="#050403" stroke-width="2"/>
        <rect x="192" y="76" width="20" height="10" rx="2" fill="#050403" opacity="0.7"/>
        <circle cx="252" cy="80" r="3" fill="url(#brassSheen)"/>
        <circle cx="252" cy="104" r="3" fill="url(#brassSheen)"/>
        <circle cx="196" cy="104" r="3" fill="url(#brassSheen)"/>

        <!-- barrel -->
        <rect x="264" y="78" width="316" height="18" rx="6"
              fill="url(#metal)" stroke="#050403" stroke-width="2"/>
        <rect x="264" y="80" width="316" height="4" fill="#4a4438" opacity="0.5"/>

        <!-- pump foregrip -->
        <g>
            <rect x="330" y="92" width="92" height="30" rx="10"
                  fill="url(#wood)" stroke="#050403" stroke-width="2"/>
            <line x1="344" y1="96" x2="344" y2="118" stroke="#1c1108" stroke-width="2"/>
            <line x1="358" y1="96" x2="358" y2="118" stroke="#1c1108" stroke-width="2"/>
            <line x1="372" y1="96" x2="372" y2="118" stroke="#1c1108" stroke-width="2"/>
            <line x1="386" y1="96" x2="386" y2="118" stroke="#1c1108" stroke-width="2"/>
            <line x1="400" y1="96" x2="400" y2="118" stroke="#1c1108" stroke-width="2"/>
            <line x1="414" y1="96" x2="414" y2="118" stroke="#1c1108" stroke-width="2"/>
        </g>

        <!-- muzzle band + bead sight -->
        <rect x="566" y="76" width="14" height="22" rx="2" fill="url(#brassSheen)" stroke="#050403" stroke-width="1.5"/>
        <circle cx="588" cy="80" r="3.5" fill="url(#brassSheen)" stroke="#050403" stroke-width="1"/>

    </g>
</svg>
