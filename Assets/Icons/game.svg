<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Play">
    <defs>
        <radialGradient id="face" cx="35%" cy="30%" r="75%">
            <stop offset="0%"  stop-color="#221c12"/>
            <stop offset="100%" stop-color="#0f0d0a"/>
        </radialGradient>
        <linearGradient id="ring" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#e6c065"/>
            <stop offset="55%"  stop-color="#c9962c"/>
            <stop offset="100%" stop-color="#7a5f22"/>
        </linearGradient>
        <linearGradient id="hull" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#e2422a"/>
            <stop offset="100%" stop-color="#8f2312"/>
        </linearGradient>
    </defs>

    <!-- outer brass rim -->
    <circle cx="32" cy="32" r="30" fill="url(#ring)"/>

    <!-- dark face -->
    <circle cx="32" cy="32" r="25" fill="url(#face)"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#050403" stroke-width="1.5" opacity="0.6"/>

    <!-- a small cluster of shells -->
    <g>
        <!-- left shell, tilted slightly -->
        <g transform="rotate(-10 20 32)">
            <rect x="15.5" y="18" width="9" height="19" rx="1.8" fill="url(#hull)" stroke="#050403" stroke-width="1.1"/>
            <line x1="15.5" y1="22" x2="24.5" y2="22" stroke="#050403" stroke-width="0.8" opacity="0.35"/>
            <rect x="15" y="37" width="10" height="7" rx="1.3" fill="#e9b32b" stroke="#050403" stroke-width="1.1"/>
            <circle cx="20" cy="40.5" r="1.5" fill="#7a5f22"/>
        </g>

        <!-- center shell, standing tall -->
        <g>
            <rect x="27.5" y="12" width="9" height="24" rx="1.8" fill="url(#hull)" stroke="#050403" stroke-width="1.1"/>
            <line x1="27.5" y1="17" x2="36.5" y2="17" stroke="#050403" stroke-width="0.8" opacity="0.35"/>
            <line x1="27.5" y1="21" x2="36.5" y2="21" stroke="#050403" stroke-width="0.8" opacity="0.35"/>
            <rect x="27" y="36" width="10" height="7" rx="1.3" fill="#e9b32b" stroke="#050403" stroke-width="1.1"/>
            <circle cx="32" cy="39.5" r="1.5" fill="#7a5f22"/>
        </g>

        <!-- right shell, tilted the other way -->
        <g transform="rotate(12 44 32)">
            <rect x="39.5" y="19" width="9" height="18" rx="1.8" fill="url(#hull)" stroke="#050403" stroke-width="1.1"/>
            <line x1="39.5" y1="23" x2="48.5" y2="23" stroke="#050403" stroke-width="0.8" opacity="0.35"/>
            <rect x="39" y="37" width="10" height="7" rx="1.3" fill="#e9b32b" stroke="#050403" stroke-width="1.1"/>
            <circle cx="44" cy="40.5" r="1.5" fill="#7a5f22"/>
        </g>
    </g>

    <!-- primer accent dot, echoes the nav shell detail -->
    <circle cx="47" cy="47" r="3.4" fill="#be5500"/>
</svg>
