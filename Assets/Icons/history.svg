<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Match History">
    <defs>
        <radialGradient id="face" cx="35%" cy="30%" r="75%">
            <stop offset="0%"  stop-color="#221c12"/>
            <stop offset="100%" stop-color="#0f0d0a"/>
        </radialGradient>
        <linearGradient id="ring" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#e6c065"/>
            <stop offset="55%"  stop-color="#c9962c"/>
            <stop offset="100%" stop-color="#7a5f22"/>
        </linearGradient>
    </defs>

    <!-- outer brass rim -->
    <circle cx="32" cy="32" r="30" fill="url(#ring)"/>

    <!-- dark face -->
    <circle cx="32" cy="32" r="25" fill="url(#face)"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#050403" stroke-width="1.5" opacity="0.6"/>

    <!-- ledger list -->
    <circle cx="21" cy="23" r="2.2" fill="#e9b32b"/>
    <line x1="27" y1="23" x2="44" y2="23" stroke="#e9b32b" stroke-width="3" stroke-linecap="round"/>

    <circle cx="21" cy="32" r="2.2" fill="#e9b32b"/>
    <line x1="27" y1="32" x2="44" y2="32" stroke="#e9b32b" stroke-width="3" stroke-linecap="round"/>

    <circle cx="21" cy="41" r="2.2" fill="#e9b32b"/>
    <line x1="27" y1="41" x2="40" y2="41" stroke="#e9b32b" stroke-width="3" stroke-linecap="round"/>

    <!-- primer accent dot, echoes the nav shell detail -->
    <circle cx="47" cy="47" r="3.4" fill="#be5500"/>
</svg>
