<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Settings">
    <defs>
        <radialGradient id="face" cx="35%" cy="30%" r="75%">
            <stop offset="0%"  stop-color="#221c12"/>
            <stop offset="100%" stop-color="#0f0d0a"/>
        </radialGradient>
        <linearGradient id="ring" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#e6c065"/>
            <stop offset="55%"  stop-color="#c9962c"/>
            <stop offset="100%" stop-color="#7a5f22"/>
        </linearGradient>
    </defs>

    <!-- outer brass rim -->
    <circle cx="32" cy="32" r="30" fill="url(#ring)"/>

    <!-- dark face -->
    <circle cx="32" cy="32" r="25" fill="url(#face)"/>
    <circle cx="32" cy="32" r="25" fill="none" stroke="#050403" stroke-width="1.5" opacity="0.6"/>

    <!-- gear teeth -->
    <g fill="#e9b32b">
        <rect x="29" y="12" width="6" height="8" rx="1.5"/>
        <rect x="29" y="44" width="6" height="8" rx="1.5"/>
        <rect x="12" y="29" width="8" height="6" rx="1.5"/>
        <rect x="44" y="29" width="8" height="6" rx="1.5"/>

        <rect x="29" y="12" width="6" height="8" rx="1.5" transform="rotate(45 32 32)"/>
        <rect x="29" y="44" width="6" height="8" rx="1.5" transform="rotate(45 32 32)"/>
        <rect x="12" y="29" width="8" height="6" rx="1.5" transform="rotate(45 32 32)"/>
        <rect x="44" y="29" width="8" height="6" rx="1.5" transform="rotate(45 32 32)"/>
    </g>

    <!-- gear body -->
    <circle cx="32" cy="32" r="13" fill="#e9b32b"/>
    <circle cx="32" cy="32" r="5.5" fill="url(#face)"/>

    <!-- primer accent dot, echoes the nav shell detail -->
    <circle cx="47" cy="47" r="3.4" fill="#be5500"/>
</svg>
